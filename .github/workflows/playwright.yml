name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # "Full Reset Cycle" is excluded here — it's the one test that changes
      # and restores a real password on the dedicated forgot-password test
      # account, and it can also collide with the Real OTP test above if
      # both fire concurrently against the same account. Run it manually
      # (npx playwright test --grep "Full Reset Cycle") when you need it.
      run: npx playwright test --grep-invert "Full Reset Cycle"
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30

  deploy-report:
    # Only deploy from pushes to main/master — PR runs still test, but don't publish.
    # !cancelled() (not the default success()) means this still runs and deploys
    # the report even when tests fail — only a manual cancel skips it.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        name: allure-results
        path: allure-results

    - name: Load previous report history
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Restore history.jsonl from the last deployed report
      run: |
        mkdir -p allure-history
        if [ -f gh-pages/history.jsonl ]; then
          cp gh-pages/history.jsonl allure-history/history.jsonl
        fi

    # allurerc.mjs points historyPath at ./allure-history/history.jsonl —
    # generate reads it, appends this run, and updates it in place.
    - name: Build Allure report
      run: npx allure generate

    - name: Carry the updated history forward for the next run
      run: cp allure-history/history.jsonl allure-report/history.jsonl

    - name: Deploy report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report
